name: clippy
description: Clippy mobile client — LAN-only clipboard sync.
publish_to: 'none'
version: 0.3.1+4

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  flutter_secure_storage: ^9.2.2
  mobile_scanner: ^5.2.3
  web_socket_channel: ^3.0.0
  google_fonts: ^6.2.1
  sodium: ^3.0.0
  sodium_libs: ^3.4.0
  permission_handler: ^11.3.1
  flutter_local_notifications: ^17.2.0
  connectivity_plus: ^6.0.5
  file_picker: ^8.1.2
  crypto: ^3.0.5
  flutter_background_service: ^5.0.10
  flutter_background_service_android: ^6.2.7
  disable_battery_optimization: ^1.1.2
  multicast_dns: ^0.3.3
  share_plus: ^12.0.2
  url_launcher: ^6.3.2
  gal: ^2.3.2
  receive_sharing_intent: ^1.8.1
  sentry_flutter: ^8.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

# Generated launcher icons (run: dart run flutter_launcher_icons).
# Source PNGs come from assets/brand/*.svg via desktop/scripts/gen-icons.mjs.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_background: "assets/icon/icon_background.png"
  min_sdk_android: 21
