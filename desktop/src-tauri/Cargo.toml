[package]
name = "clippy"
version = "0.1.0"
description = "Clippy - LAN-only clipboard manager"
authors = ["Parth"]
edition = "2021"

[lib]
name = "clippy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.40", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled", "blob"] }
sha2 = "0.10"
clipboard-master = "4.0"
arboard = "3.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
rodio = { version = "0.19", default-features = false, features = ["vorbis"] }
zbus = { version = "4", default-features = false, features = ["tokio"] }
enigo = "0.2"
notify-rust = "4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
url = "2"
once_cell = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"
emojis = "0.6"
mime_guess = "2"
scraper = "0.20"
regex-lite = "0.1"
open = "5"
urlencoding = "2"
futures-lite = "2"

[dev-dependencies]
tempfile = "3"
mockito = "1"
