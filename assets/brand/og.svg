<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="0.28" cy="0.85" r="0.8">
      <stop offset="0" stop-color="#E95678" stop-opacity="0.32"/>
      <stop offset="0.7" stop-color="#E95678" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0E0E15"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="6" y="6" width="1188" height="618" rx="22" fill="none" stroke="#2D2D3A" stroke-width="2"/>

  <!-- brand lockup (mark + wordmark), top-left -->
  <g transform="translate(80 70)">
    <g transform="scale(2.1)">
      <rect x="0" y="2" width="20" height="16" rx="3" fill="#E95678"/>
      <rect x="7" y="-1" width="6" height="4" rx="1.5" fill="#ECECF1"/>
      <line x1="5" y1="8" x2="15" y2="8" stroke="#16161F" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="5" y1="12" x2="11" y2="12" stroke="#16161F" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <text x="56" y="32" font-family="Geist, system-ui, sans-serif" font-size="34" font-weight="700" fill="#ECECF1" letter-spacing="-0.5">Clippy</text>
  </g>

  <!-- headline -->
  <text x="80" y="320" font-family="Geist, system-ui, sans-serif" font-size="88" font-weight="800" letter-spacing="-3" fill="#ECECF1">Your clipboard</text>
  <text x="80" y="420" font-family="Geist, system-ui, sans-serif" font-size="88" font-weight="800" letter-spacing="-3"><tspan fill="#ECECF1">deserves </tspan><tspan fill="#E95678" font-style="italic">better.</tspan></text>

  <!-- subline -->
  <text x="82" y="478" font-family="Geist, system-ui, sans-serif" font-size="28" fill="#9999A8">Remembers every clip · searches them all · syncs to your phone.</text>

  <!-- footer tags -->
  <text x="82" y="560" font-family="'Geist Mono', ui-monospace, monospace" font-size="22" fill="#5C5C6B" letter-spacing="0.5">LAN-only  ·  Ubuntu + Android  ·  end-to-end encrypted  ·  GPLv3</text>
</svg>
