<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6B8A"/>
      <stop offset="1" stop-color="#C73A5C"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round">
      <rect x="0" y="0" width="1024" height="1024" rx="225" ry="225"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>
    <rect x="0" y="0" width="1024" height="410" fill="url(#gloss)"/>
  </g>

  <!-- MarkClipboard, coral theme (white body/clip, dark page lines). 64-space, scaled 9.286, centered. -->
  <g transform="translate(214.84 214.84) scale(9.286)">
    <rect x="13" y="17" width="38" height="42" rx="4" fill="#FFFFFF"/>
    <rect x="17" y="11" width="30" height="9" rx="2" fill="#FFFFFF"/>
    <rect x="27" y="6" width="10" height="4" rx="1.5" fill="#FFFFFF" opacity="0.85"/>
    <g stroke="#1A1A24" stroke-width="2.2" stroke-linecap="round">
      <line x1="20" y1="29" x2="44" y2="29" opacity="0.92"/>
      <line x1="20" y1="36" x2="40" y2="36" opacity="0.85"/>
      <line x1="20" y1="43" x2="42" y2="43" opacity="0.7"/>
      <line x1="20" y1="50" x2="34" y2="50" opacity="0.6"/>
    </g>
  </g>
</svg>
